[package]
name = "app-viewer"
version = "0.7.1"
edition = "2021"
default-run = "app-viewer"

# The GUI, plus the `appv` CLI installed next to it (the NSIS installer ships every bin).
[[bin]]
name = "app-viewer"
path = "src/main.rs"

[[bin]]
name = "appv"
path = "src/bin/appv/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# Same versions as wry's: `Webview::with_webview` hands out WebView2 COM objects of those crates.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
png = "0.17"
windows-sys = { version = "0.59", features = ["Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
