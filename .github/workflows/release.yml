name: Release

on:
  push:
    tags:
      - "v*"

# Seul le GITHUB_TOKEN est utilisé : pas de signature de code ni d'autre secret.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Installeur NSIS et GitHub Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que le tag correspond à la version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            Write-Error "Le tag $env:TAG ne correspond pas à la version de tauri.conf.json (v$version)."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: build
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: npm ci
        run: npm ci

      - name: tauri build
        run: npm run build

      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName })
          if ($installers.Count -eq 0) { Write-Error "Aucun installeur NSIS produit."; exit 1 }
          gh release create $env:TAG @installers --title "App Viewer $env:TAG" --generate-notes --verify-tag
