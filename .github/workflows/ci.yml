name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "lot/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: src-tauri/Cargo.toml

jobs:
  check:
    name: Tests, clippy, audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: check

      - name: cargo test
        run: cargo test --locked --manifest-path ${{ env.MANIFEST }}

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path ${{ env.MANIFEST }} --all-targets -- -D warnings

      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

  build:
    name: Installeur NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: build

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: npm ci
        run: npm ci

      - name: tauri build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: app-viewer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
