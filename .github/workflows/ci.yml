name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "lot/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: src-tauri/Cargo.toml

jobs:
  check:
    name: Tests, clippy, audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check

      - name: cargo test
        run: cargo test --locked --manifest-path ${{ env.MANIFEST }}

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path ${{ env.MANIFEST }} --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

  build:
    name: Installeur NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: build

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: npm ci
        run: npm ci

      - name: tauri build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: app-viewer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
